minimumReleaseAgeExclude:
  - '@vueuse/core@14.4.0'
  - '@vueuse/metadata@14.4.0'
  - '@vueuse/nuxt@14.4.0'
  - '@vueuse/shared@14.4.0'
shamefullyHoist: true
shellEmulator: true
strictPeerDependencies: false
autoInstallPeers: false
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
packages: []
catalog:
  '@convex-dev/better-auth': ^0.12.5
  better-auth: ~1.6.25
  convex: ^1.42.3
  react: ^19.2.8
catalogs:
  build:
    '@nuxt/devtools': ^3.3.1
    '@nuxt/eslint': ^1.16.0
    '@nuxt/kit': ^4.5.1
    '@nuxtjs/color-mode': ^4.0.1
    '@pinia/nuxt': ^1.0.1
    '@unocss/eslint-config': ^66.7.5
    '@unocss/nuxt': ^66.7.5
    '@unocss/preset-web-fonts': ^66.7.5
    '@vite-pwa/nuxt': ^1.1.1
    '@vueuse/nuxt': ^14.4.0
    chokidar: ^5.0.0
    nuxt: ^4.5.1
    semver: ^7.8.5
    unocss: ^66.7.5
    unplugin: ^3.3.0
    vite: ^8.1.5
  dev:
    '@antfu/eslint-config': ^9.2.0
    '@types/node': ^24.13.3
    eslint: ^10.8.0
    eslint-plugin-format: ^2.0.1
    lint-staged: ^17.2.0
    simple-git-hooks: ^2.13.1
    typescript: ^6.0.3
    vitest: ^4.1.0
    vue-tsc: ^3.3.8
  frontend:
    '@vueuse/core': ^14.4.0
    pinia: ^4.0.2
    vue: ^3.5.40
  icons:
    '@iconify-json/carbon': ^1.2.24
    '@iconify-json/twemoji': ^1.2.5
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - unrs-resolver
peerDependencyRules:
  allowedVersions:
    vite-dev-rpc@1.1.0>vite: '8'
    vite-hot-client@2.1.0>vite: '8'
    vite-plugin-inspect@11.3.3>vite: '8'
    vite-plugin-pwa@1.2.0>vite: '8'
    vite-plugin-vue-tracer@1.3.0>vite: '8'

  ignoreMissing:
    - webpack
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  simple-git-hooks: true
  unrs-resolver: true
